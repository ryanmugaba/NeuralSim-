[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuralsim"
version = "0.1.0"
description = "Replay PhysioNet EEG motor imagery as a simulated 4-command brain-computer interface."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["eeg", "bci", "mne", "motor-imagery", "physionet", "simulation"]
dependencies = ["mne>=1.5", "numpy>=1.23"]

[project.optional-dependencies]
sklearn = ["scikit-learn>=1.1"]
dev = ["pytest>=7"]

[project.scripts]
neuralsim-demo = "neuralsim.demo:main"

[tool.setuptools.packages.find]
exclude = ["tests*"]
